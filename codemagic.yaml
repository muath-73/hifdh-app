workflows:
  ios-workflow:
    name: حِفظ - بناء iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # تضيفها من Codemagic UI: Teams > Environment variables
    scripts:
      - name: إنشاء مجلد iOS تلقائياً لو مو موجود
        script: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi
      - name: تثبيت المكتبات
        script: |
          flutter pub get
      - name: بناء نسخة iOS موقّعة
        script: |
          xcode-project use-profiles
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
